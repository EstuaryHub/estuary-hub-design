name: Content suggestion
description: Propose new or changed content that isn't yet a tracked decision
title: "[Suggestion]: "
labels: ["documentation", "enhancement"]
body:
  - type: input
    id: location
    attributes:
      label: Document
      description: Which doc does this affect?
      placeholder: docs/...
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What to add or change
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What gap does this close, or who does it help?
    validations:
      required: true
