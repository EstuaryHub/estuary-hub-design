name: New decision needed
description: Propose a question that should be tracked in the open questions backlog
title: "[Decision]: "
labels: ["question", "decision-needed"]
body:
  - type: dropdown
    id: owner
    attributes:
      label: Who decides this?
      description: See docs/decisions/open-questions.md for how questions are sorted by owner
      options:
        - Product owners (what the product does and for whom)
        - Board (licence, accounts, maintainer, data stewardship)
        - Technology team (how it is built)
        - External review (needs qualified outside advice)
        - Fact-finding (someone needs to go find this out)
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: The question
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Which release does this hold up?
      placeholder: Static MVP / Static V1 / App MVP / App V1 / none
    validations:
      required: false
