name: Discovery interview finding
description: Capture a distilled finding from a discovery conversation
title: "[Discovery]: "
labels: ["discovery", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Raw interview notes never enter this repo. Summarize the finding at a level you'd be
        comfortable sharing publicly, per the discovery interview guide.
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: What did you learn, distilled and anonymized as needed?
    validations:
      required: true
  - type: textarea
    id: implication
    attributes:
      label: Implication
      description: Which open question or doc should this feed into?
    validations:
      required: false
  - type: checkboxes
    id: public
    attributes:
      label: This issue is public
      options:
        - label: I haven't included anyone's name, email, phone number, location or interview notes.
          required: true
